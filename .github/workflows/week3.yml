name: Week 3 checks
on:
  push:
    branches: [feat/week3-thousand-todos]
    paths: ['week3/**', '.github/workflows/week3.yml']
  pull_request:
    paths: ['week3/**', '.github/workflows/week3.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: week3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week3-build-and-checks
          path: |
            week3/dist/
            week3/package-lock.json
            week3/test-results/
